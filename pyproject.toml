[project]
name = "airadio"
version = "0.1.0"
description = "AIニュースラジオ局 (GIGAZINE のニュース + ローカル生成 BGM)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "aiohttp>=3.9",
]

[dependency-groups]
dev = []

# アプリケーション (ライブラリではない) なのでビルドしない。
# 依存だけを .venv に入れ、scripts/ は直接実行する。
#
# 注意: bgm_worker.py だけはこの venv では動かない。torch (ROCm/gfx1151) が
# 要るので ~/heartlib/.venv の python で、PYTHONPATH に scripts/ を通して
# 起動する (start_all.sh 参照)。
[tool.uv]
package = false
